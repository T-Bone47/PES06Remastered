; remaster.ini - user-facing configuration for the PES 6 Legacy Remaster.
; Place this file next to pes6.exe. Every value is optional; the defaults
; below are what the code assumes when a key is missing.

[core]
; Master switch. 0 = load but stay completely inert (the game runs as if the
; remaster were not present).
enabled = 1

[graphics]
; 0 = leave the rendering alone.
enabled = 1

; Quality preset: "classic", "enhanced", "hd", "maximum", or "ultra" (default = ultra).
; - classic: 100% bit-exact original 2006 engine rendering (no internal scaling, no color grading, no HUD overlay).
; - enhanced: 720p internal rendering, 8x hardware anisotropic filtering, subtle contrast enhancement (+5%).
; - hd: 1080p internal rendering, 16x hardware anisotropic filtering, lush pitch vibrance (+15%), modern broadcast score bug.
; - maximum: 1440p (2K) internal rendering, 16x hardware anisotropic filtering, HDR S-curve grading, full analytics overlay.
; - ultra / 4k: 2160p (4K UHD) internal rendering, 16x hardware anisotropic filtering, dynamic filmic tonemapping, broadcast score bug.
preset = ultra

; Target backbuffer and window size.
; 1280x720 is ideal for 16:9 windowed play on displays up to 1080p (including 125% DPI scaling).
; For 1080p borderless/fullscreen, set 1920x1080.
width = 1280
height = 720

; Aspect ratio correction:
; "auto" = automatically calculate from width and height (e.g. 1.7778 for 16:9)
; "16:9", "16:10", "4:3", "21:9", "32:9", or custom float like "1.77778".
; Fixes player model stretching and expands the 3D horizontal field of view.
aspect_ratio = auto

; Internal scene rendering resolution (Kingsley813 discovery).
; Overrides the default 1024x1024 scene buffer to render 3D geometry at native
; sharpness prior to backbuffer presentation.
internal_resolution_width = 1920
internal_resolution_height = 1080

; Force the windowed presentation path. Fullscreen is not implemented yet;
; the game currently drops back to 800x600 when it cannot set a display mode.
windowed = 1

; Log every D3D8 texture the game creates. This is how the texture inventory
; was built; leave it off during normal play, it is very noisy.
log_textures = 0

; Log the texture size the game asks for, and the lock/unlock calls. Very
; noisy; used while working on the texture pipeline.
log_locks = 0

; Report every texture the game uploads, with the size and a CRC32 of the
; pixels it uploaded. This is what ties an archive entry to the texture it
; ends up in, which is what a higher resolution replacement needs.
observe_textures = 0

; Make the game allocate the artwork textures this many times larger than it
; asks for. The texture is then filled with the pack's artwork, filtered down
; from whatever resolution it was authored at.
;
; 1 leaves the sizes alone (native pristine texture format, zero compression corruption).
; 2 doubles them, which only applies to uncompressed 32-bit ARGB textures.
texture_scale = 1

; Cinematic Color Grading & Modern Tonemapping
; S-curve contrast, vibrance boost for lush turf and kit colors, and shadow detail lift.
color_grading = 1
contrast = 1.10
vibrance = 1.15
brightness = 0.02
gamma = 1.00

; Modern TV Broadcast Score Bug & Live Telemetry Overlay
modern_hud = 1

[analytics]
; Live Tactical Intelligence, Expected Goals (xG), and Match Momentum tracking
enabled = 1
xg_model = calibrated
momentum_decay = 0.15

[gameplay]
; Gameplay subsystem (the upstream PESMod layer: custom leagues, kits, squads,
; players, and the custom-team crash fixes).
enabled = 1

[fileio]
; Logs every file the game opens and the data it moves. Diagnostic only:
; the calls are forwarded unchanged. Use it to find where the game keeps
; its option file.
enabled = 1

[telemetry]
; Read-only match telemetry. Samples the match clock, the phase and the
; per-player records into remaster_telemetry.csv in the game folder.
; Nothing is written to the game's memory and nothing is called in it.
enabled = 1

; Enable hotkey-labeled memory snapshots (F5=still, F6=sprint, F7=goal, F8=clock).
; Requires telemetry enabled=1. Writes labeled binary snapshots to remaster_scan/.
snapshots = 1

[assets]
; Replacement of the assets the game loads from dat\<lang>_text.afs.
; Needs a pack folder next to the game executable; see docs/ASSETS.md.
; With no pack present this is a no-op.
enabled = 1

; Log every asset the game inflates, with its CRC32 signature. Very noisy,
; and only useful when authoring or debugging a pack.
log_all = 0

; The folder that holds the pack. Relative to the game executable.
pack = remaster_pack

[broadcast]
; Intelligent Broadcast Director & Event Presentation
; Manages pitch-aware dynamic camera, instant replay bypass, and event tracking.
enabled = 1

; Dynamic camera zooming based on pitch position (midfield overview vs box penetration)
dynamic_camera = 1

; Base camera zoom distance (vanilla = 1430.0)
base_zoom = 1430.0

; Zoom multiplier when ball is in midfield (wider tactical overview)
midfield_zoom_mult = 1.15

; Zoom multiplier when ball penetrates 18-yard box (tight tracking)
box_zoom_mult = 0.85

; Zoom multiplier on goal celebration
goal_zoom_mult = 0.65

; Smoothing speed for zoom transition (0.01 = very slow, 1.0 = instant)
zoom_lerp_speed = 0.08

; Fix stadium roof and upper-tier geometry clipping (disabled to protect turf rendering passes)
stadium_clipping_fix = 0

; Instant replay skip: press Spacebar, Enter, or Escape to bypass replay immediately
instant_replay_skip = 1

; Contextual multi-angle replay camera switching
cinematic_replays = 1

[gameplay_enhanced]
; Bounded Enhanced Gameplay Systems (with Strict Classic Mode Preservation)
; 0 = Classic Mode (100% bit-exact vanilla simulation, zero gameplay hooks)
; 1 = Enhanced Mode (individually toggleable sliders bounded within ±15% safety envelope)
enabled = 1

; Tactical team width modifier: 0.85 to 1.15 (1.0 = vanilla, 1.05 = slightly wider off-ball defensive block)
team_width_factor = 1.05

; Dynamic pressing aggression: increases opponent AI pressing when trailing late in match
dynamic_pressing = 1

; Dynamic pressing multiplier cap: 1.00 to 1.15 (1.0 = vanilla, 1.10 = +10% pressing distance)
pressing_aggression_cap = 1.10

; Through-ball channel lead multiplier: 0.85 to 1.15 (1.0 = vanilla, 1.05 = slightly more forward channel lead)
pass_lead_factor = 1.05

; Ball air drag modifier: 0.95 to 1.05 (1.0 = vanilla ball physics)
ball_drag_factor = 1.00

; Enforce strict safety envelope: clamps all parameters within ±15% to guarantee simulation stability
enforce_safety_envelope = 1






